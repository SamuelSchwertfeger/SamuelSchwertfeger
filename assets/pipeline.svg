<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <style>
    .flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-13}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606A"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4FA3FF"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1A7F37"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="112" width="220" height="96" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
    <text x="140" y="152" font-size="19" font-weight="600" fill="#1F2328">Linux host</text>
    <text x="140" y="178" font-size="14" fill="#57606A">services · cron · SSH keys · shells</text>
    <path class="flow" d="M250,160 L298,160" stroke="#57606A" stroke-width="2" marker-end="url(#a)"/>

    <rect x="300" y="112" width="220" height="96" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
    <text x="410" y="152" font-size="19" font-weight="600" fill="#1F2328">Detected changes</text>
    <text x="410" y="178" font-size="14" fill="#57606A">diff against a known baseline</text>
    <path class="flow" d="M520,160 L568,160" stroke="#57606A" stroke-width="2" marker-end="url(#a)"/>

    <rect x="570" y="112" width="250" height="96" rx="10" fill="#0A1F3C" stroke="#0A1F3C"/>
    <text x="695" y="152" font-size="19" font-weight="600" fill="#FFFFFF">Machine-aware local LLM</text>
    <text x="695" y="178" font-size="14" fill="#C9D6E8">reasons about each change</text>

    <rect x="570" y="252" width="250" height="78" rx="10" fill="#FFFFFF" stroke="#4FA3FF" stroke-dasharray="5 4"/>
    <text x="695" y="284" font-size="16" font-weight="600" fill="#1F2328">Machine context</text>
    <text x="695" y="308" font-size="13" fill="#57606A">package history · admin activity</text>
    <path class="flow" d="M695,252 L695,210" stroke="#4FA3FF" stroke-width="2" marker-end="url(#b)"/>

    <path class="flow" d="M820,160 C850,160 850,92 878,92" fill="none" stroke="#1A7F37" stroke-width="2" marker-end="url(#g)"/>
    <path class="flow" d="M820,160 C850,160 850,228 878,228" fill="none" stroke="#CF222E" stroke-width="2" marker-end="url(#r)"/>

    <rect x="880" y="54" width="290" height="76" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
    <rect x="880" y="54" width="6" height="76" rx="3" fill="#1A7F37"/>
    <text x="1028" y="86" font-size="18" font-weight="600" fill="#1A7F37">User change</text>
    <text x="1028" y="110" font-size="14" fill="#57606A">expected, explained, allowed</text>

    <rect x="880" y="190" width="290" height="76" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
    <rect x="880" y="190" width="6" height="76" rx="3" fill="#CF222E"/>
    <text x="1028" y="222" font-size="18" font-weight="600" fill="#CF222E">Attacker persistence</text>
    <text x="1028" y="246" font-size="14" fill="#57606A">flagged with evidence for the analyst</text>
  </g>
</svg>
